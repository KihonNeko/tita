name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install target
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - name: install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --target ${{ matrix.target }}
      - name: build
        run: cargo build --release --target ${{ matrix.target }}
      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/tita README.md dist/
          tar -czf tita-${{ github.ref_name }}-${{ matrix.name }}.tar.gz -C dist .
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/tita.exe, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath tita-${{ github.ref_name }}-${{ matrix.name }}.zip
      - name: publish to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # each system publishes its own archive as soon as it is built;
          # whichever job gets there first creates the release
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --title "tita ${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" tita-${{ github.ref_name }}-* \
            --repo "${{ github.repository }}" --clobber
