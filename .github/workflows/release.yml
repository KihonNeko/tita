name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install target
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - name: install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --target ${{ matrix.target }}
      - name: build
        run: cargo build --release --target ${{ matrix.target }}
      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/tita README.md dist/
          tar -czf tita-${{ github.ref_name }}-${{ matrix.name }}.tar.gz -C dist .
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/tita.exe, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath tita-${{ github.ref_name }}-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tita-${{ matrix.name }}
          path: |
            tita-*.tar.gz
            tita-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" artifacts/*
          --repo "${{ github.repository }}"
          --title "tita ${{ github.ref_name }}"
          --generate-notes
