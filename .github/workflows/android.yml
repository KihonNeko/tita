name: android

# Builds the Android app. Every branch push replaces the "android-preview"
# pre-release with the new APK (and keeps it under "Artifacts" on the run's
# page); a version tag attaches it to that version's release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Optional repository secrets. Without them the APK is signed with a
      # key made for this run only, and cannot update an installed app.
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - name: install targets
        run: |
          rustup update stable && rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-${{ hashFiles('Cargo.lock') }}
      - name: test
        run: cargo test -p tita -p tita-mobile
      - name: build the apk
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          VERSION_CODE=${{ github.run_number }} mobile/build-apk.sh
          cp target/apk/tita.apk "tita-${GITHUB_REF_NAME//\//-}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: tita-android
          path: tita-*-android.apk
      - name: publish the preview
        # A pre-release replaced on every branch push: one fixed link to the
        # newest APK, easy to open from a phone. Never the "latest" release.
        if: startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/apk/tita.apk tita-android.apk
          gh release delete android-preview --repo "${{ github.repository }}" --cleanup-tag --yes || true
          gh release create android-preview tita-android.apk --repo "${{ github.repository }}" \
            --prerelease --target "${{ github.sha }}" --title "tita for Android (preview)" \
            --notes "Built from \`${{ github.ref_name }}\` at ${{ github.sha }}. Signed with a throwaway key unless the signing secrets are set: uninstall the previous preview before installing this one."
      - name: publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --title "tita ${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" tita-*-android.apk \
            --repo "${{ github.repository }}" --clobber
