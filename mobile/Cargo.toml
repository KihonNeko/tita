[package]
name = "tita-mobile"
version = "0.2.0"
edition = "2024"
publish = false
description = "tita on Android: the terminal interface, drawn in pixels and driven by touch"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tita = { path = ".." }
fontdue = "0.9"
log = "0.4"
softbuffer = "0.4"
winit = { version = "0.30", features = ["android-native-activity"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(not(target_os = "android"))'.dependencies]
png = "0.17"
